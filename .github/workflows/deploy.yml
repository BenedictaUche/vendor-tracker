name: Test, Build, and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for staging
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL }}
          NEXT_PUBLIC_USER_POOL_ID: ${{ secrets.STAGING_USER_POOL_ID }}
          NEXT_PUBLIC_USER_POOL_CLIENT_ID: ${{ secrets.STAGING_USER_POOL_CLIENT_ID }}
        run: npm run build

      - name: Verify frontend build output
        run: ls -la frontend && ls -la frontend/out

      - name: Install CDK globally
        run: npm install -g aws-cdk

      - name: Deploy backend stack to staging
        working-directory: backend
        run: cdk deploy -c env=staging --require-approval never

      - name: Upload frontend to S3 (staging)
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name VendorTracker-staging \
            --query "Stacks[0].Outputs[?OutputKey=='StagingBucketName'].OutputValue" \
            --output text)

          aws s3 sync frontend/out/ s3://$BUCKET_NAME --delete

      - name: Invalidate CloudFront cache (staging)
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name VendorTracker-staging \
            --query "Stacks[0].Outputs[?OutputKey=='StagingDistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for production
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.PROD_API_URL }}
          NEXT_PUBLIC_USER_POOL_ID: ${{ secrets.PROD_USER_POOL_ID }}
          NEXT_PUBLIC_USER_POOL_CLIENT_ID: ${{ secrets.PROD_USER_POOL_CLIENT_ID }}
        run: npm run build

      - name: Verify frontend build output
        run: ls -la frontend && ls -la frontend/out

      - name: Install CDK globally
        run: npm install -g aws-cdk

      - name: Deploy backend stack to production
        working-directory: backend
        run: cdk deploy -c env=production --require-approval never

      - name: Upload frontend to S3 (production)
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name VendorTracker-production \
            --query "Stacks[0].Outputs[?OutputKey=='ProdBucketName'].OutputValue" \
            --output text)

          aws s3 sync frontend/out/ s3://$BUCKET_NAME --delete

      - name: Invalidate CloudFront cache (production)
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name VendorTracker-production \
            --query "Stacks[0].Outputs[?OutputKey=='ProdDistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"
